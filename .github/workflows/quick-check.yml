name: quick-check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r environment/requirements-quick.txt
      - name: 1/9 Verify temperature selection trace
        if: ${{ always() }}
        run: python scripts/verify_temperature_selection.py
      - name: 2/9 Reproduce temperature stack
        if: ${{ always() }}
        run: python scripts/run_temperature_analysis.py --verify-docs
      - name: 3/9 Reproduce mechanism ablation
        if: ${{ always() }}
        run: python analysis/ablation/run_ablation.py
      - name: 4/9 Refit fixed-choice benchmark
        if: ${{ always() }}
        run: python analysis/benchmark_models/replay_benchmark.py
      - name: 5/9 Reproduce native stack SHAP
        if: ${{ always() }}
        run: python analysis/interpretability/run_native_stack_shap.py
      - name: 6/9 Verify conditional SHAP
        if: ${{ always() }}
        run: python analysis/interpretability/verify_conditional_shap.py
      - name: 7/9 Generate Figures 15-17
        if: ${{ always() }}
        run: python analysis/figures/plot_fig15_17_public.py
      - name: 8/9 Verify all frozen results
        if: ${{ always() }}
        run: python scripts/verify_results.py
      - name: 9/9 Run system software static tests
        if: ${{ always() }}
        run: python system_tests/run_system_tests.py
