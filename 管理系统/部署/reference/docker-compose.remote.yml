services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.8-alpine}
    container_name: cattle-prod-caddy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mqtt-replay-control:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/数据
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
